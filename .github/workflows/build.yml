name: Build Tweak

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Tweak
        run: make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AimbotTweak_dylib
          path: .theos/obj/debug/arm64/AimbotTweak.dylib
